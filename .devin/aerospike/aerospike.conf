service {
    proto-fd-max 15000
    cluster-name dspy-integration
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
        access-address 127.0.0.1
        access-port 23000
    }

    fabric {
        port 3001
    }

    heartbeat {
        mode mesh
        port 3002
        interval 150
        timeout 10
    }
}

namespace test {
    replication-factor 1
    nsup-period 1
    default-ttl 0

    storage-engine device {
        file /opt/aerospike/data/test.dat
        filesize 1G
    }
}
